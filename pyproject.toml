[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "rappidai-quantum"
version = "0.1.0a0"
description = "Reproducible pipelines for preparing data, training tokenizers, developing, evaluating and exporting compact language models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
  { name = "Jonas Désiré Cikemgil" },
]
keywords = ["language-models", "machine-learning", "tokenizers", "gguf", "reproducibility"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
ml = [
  "accelerate>=0.34,<2",
  "datasets>=2.20,<6",
  "numpy>=1.26,<3",
  "safetensors>=0.4.3,<1",
  "sentencepiece>=0.2,<0.3",
  "tokenizers>=0.19,<1",
  "torch>=2.3,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.44,<6",
]
dev = [
  "mypy>=1.19,<3",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "ruff>=0.15.22,<0.17",
  "types-PyYAML>=6.0.12,<7",
]

[project.urls]
Homepage = "https://www.rappidai-research.com"
Documentation = "https://github.com/rappidAI-Research/lumen-quantum/tree/main/docs"
Repository = "https://github.com/rappidAI-Research/lumen-quantum"
Issues = "https://github.com/rappidAI-Research/lumen-quantum/issues"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra"
markers = [
  "unit: isolated, deterministic tests",
  "integration: tests spanning multiple repository components",
  "slow: tests intentionally excluded from the default CI path",
  "gpu: tests requiring a GPU or accelerator runtime",
  "network: tests requiring network access or remote artifacts",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = [
  "scripts/repository_health.py",
  "scripts/validate_repository_configs.py",
  "scripts/check_markdown_links.py",
  "scripts/check_secrets.py",
  "scripts/check_canonical_urls.py",
  "scripts/release_preflight.py",
  "scripts/build_run_manifest.py",
  "scripts/capture_environment.py",
  "scripts/benchmark_cpu_inference.py",
  "scripts/check_model_cards.py",
]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "transformers.*",
  "datasets.*",
  "accelerate.*",
  "sentencepiece.*",
  "tokenizers.*",
  "safetensors.*",
]
ignore_missing_imports = true
