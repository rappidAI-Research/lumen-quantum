project:
  name: "Lumen Quantum"
  model_name: "quantum-1-base"
  run_name: "quantum-1-base-final-v1-prep"
  description: "Finale Trainingsvorbereitung fuer quantum-1-base; startet standardmaessig kein Training."

seed: 20260704

tokenizer:
  dir: "tokenizer/quantum-1"
  manifest_file: "tokenizer_manifest.json"

data:
  tokenized_dir: "data/quantum/final/tokenized"
  train_file: "data/quantum/final/tokenized/train.pt"
  validation_file: "data/quantum/final/tokenized/validation.pt"
  test_file: "data/quantum/final/tokenized/test.pt"
  tokenization_manifest: "data/quantum/final/tokenized/tokenization_manifest.json"
  block_size: 512

model:
  architecture: "LlamaForCausalLM"
  vocab_size: "auto"
  hidden_size: 512
  intermediate_size: 1536
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 8
  max_position_embeddings: 512
  rms_norm_eps: 0.000001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  parameter_count_min: 45000000
  parameter_count_max: 55000000

training:
  output_dir: "models/quantum-1-base"
  max_steps: 0
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  warmup_ratio: null
  lr_scheduler: "cosine"
  save_steps: 1000
  eval_steps: 1000
  logging_steps: 25
  max_grad_norm: 1.0
  num_workers: 2
  mixed_precision: "bf16"
  resume_from_checkpoint: null

cloud:
  target_gpu:
    - "RTX 3090 24GB"
    - "RTX 4090 24GB"
    - "A100 40GB"
  dry_run_first: true
  checkpoints: true
  resume: true
  evaluation: true
  notes: "Konfiguration vorbereitet; Training erst nach expliziter Freigabe starten."
