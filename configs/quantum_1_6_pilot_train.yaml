project:
  name: "rappidAI Quantum"
  model_name: "quantum-1.6-pilot"
  run_name: "quantum-1.6-pilot-continued-pretraining-v1"
  description: "Weights-only Continued Pretraining von quantum-1.6-pilot, initialisiert aus quantum-1-pilot (models/quantum-1-base/final). Gleiche Architektur, gleicher Tokenizer, gleiche Kontextlaenge 512."

seed: 20260716

# --- Weights-only Initialisierung aus dem bestehenden finalen Modell ---
# Es werden AUSSCHLIESSLICH Modellgewichte geladen. Optimizer-, Scheduler- und
# Schrittzustand des alten Laufs werden ausdruecklich NICHT uebernommen.
init:
  from_model: "models/quantum-1-base/final"
  weights_only: true
  reset_optimizer: true
  reset_scheduler: true
  reset_global_step: true
  # Zur Tokenizer-Kompatibilitaetspruefung: der Tokenizer im Basismodell muss
  # byte-identisch zum konfigurierten (eingefrorenen) Tokenizer sein.
  base_model_tokenizer_dir: "models/quantum-1-base/final"

tokenizer:
  # Korrekter finaler Tokenizer (byte-identisch zum Basismodell, SHA256 be99b723...).
  # tokenizer/quantum-1-pilot ist der FALSCHE, inkompatible alte Tokenizer und darf hier nie stehen.
  dir: "tokenizer/quantum-1"
  manifest_file: "tokenizer_manifest.json"

data:
  tokenized_dir: "data/quantum/quantum_1_6_pilot/tokenized"
  train_file: "data/quantum/quantum_1_6_pilot/tokenized/train.pt"
  validation_file: "data/quantum/quantum_1_6_pilot/tokenized/validation.pt"
  test_file: "data/quantum/quantum_1_6_pilot/tokenized/test.pt"
  tokenization_manifest: "data/quantum/quantum_1_6_pilot/tokenized/tokenization_manifest.json"
  block_size: 512

model:
  architecture: "LlamaForCausalLM"
  vocab_size: "auto"
  hidden_size: 512
  intermediate_size: 1536
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 8
  max_position_embeddings: 512
  rms_norm_eps: 0.000001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  parameter_count_expected: 49295872
  parameter_count_min: 49295872
  parameter_count_max: 49295872

training:
  # Output ausschliesslich in dieses Verzeichnis.
  output_dir: "models/quantum-1.6-pilot"
  # Effektive Batchgroesse: 8 * 4 = 32 Sequenzen * 512 Tokens = 16.384 Tokens/Schritt.
  # 500.000.000 / 16.384 ~= 30.518 Schritte.
  max_steps: 30518
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 500
  warmup_ratio: null
  lr_scheduler: "cosine"
  max_grad_norm: 1.0
  save_steps: 1000
  eval_steps: 1000
  logging_steps: 25
  num_workers: 2
  mixed_precision: "bf16"
  resume_from_checkpoint: null

logging:
  log_dir: "logs/quantum_1_6_pilot"
  sample_generations_file: "sample_generations.jsonl"

# Feste deutsche Beispiel-Prompts. Sie werden bei jeder Evaluation generiert und
# nach logs/quantum_1_6_pilot/sample_generations.jsonl geschrieben, damit die
# Entwicklung ueber die Trainingsschritte hinweg vergleichbar bleibt.
evaluation:
  sample_prompts:
    - "Berlin ist die Hauptstadt von"
    - "Die Sonne geht im Osten auf und"
    - "Ein Computer besteht im Kern aus"
    - "Wasser besteht aus Wasserstoff und"
    - "Im Winter wird es draussen oft"
    - "Die wichtigste Regel beim Lernen ist"
    - "Ein gesundes Fruehstueck besteht aus"
    - "Lumen ist ein"
  sample_max_new_tokens: 64
  temperature: 0.8
  top_p: 0.9

cloud:
  target_gpu:
    - "RTX 4090 24GB"
    - "A100 40GB"
    - "A100 80GB"
  dry_run_first: true
  checkpoints: true
  resume: true
  evaluation: true
  notes: "Konfiguration vorbereitet. Volltraining erst nach Datenaufbereitung und erfolgreichem Smoke-Test starten."
