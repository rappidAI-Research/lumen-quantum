project:
  name: "rappidAI Quantum"
  model_name: "quantum-1-base"
  run_name: "quantum-1-cloud-pilot-100"
  description: "Erster Cloud-GPU-Pilotlauf fuer quantum-1-base; maximal 100 Schritte."

seed: 20260703

tokenizer:
  dir: "tokenizer/quantum-1-pilot"
  manifest_file: "tokenizer_manifest.json"

data:
  tokenized_dir: "data/quantum/tokenized/pilot"
  train_file: "data/quantum/tokenized/pilot/train.pt"
  validation_file: "data/quantum/tokenized/pilot/validation.pt"
  test_file: "data/quantum/tokenized/pilot/test.pt"
  tokenization_manifest: "data/quantum/tokenized/pilot/tokenization_manifest.json"
  block_size: 512

model:
  architecture: "LlamaForCausalLM"
  vocab_size: "auto"
  hidden_size: 512
  intermediate_size: 1536
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 8
  max_position_embeddings: 512
  rms_norm_eps: 0.000001
  rope_theta: 10000.0
  tie_word_embeddings: true
  attention_dropout: 0.0
  initializer_range: 0.02
  parameter_count_min: 45000000
  parameter_count_max: 55000000

training:
  output_dir: "models/quantum-1-cloud-pilot"
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 10
  warmup_ratio: null
  lr_scheduler: "cosine"
  max_steps: 100
  save_steps: 25
  eval_steps: 25
  logging_steps: 5
  max_grad_norm: 1.0
  num_workers: 0
  mixed_precision: "auto"
  resume_from_checkpoint: null

cloud:
  target_gpu:
    - "RTX 3090 24GB"
    - "RTX 4090 24GB"
  dry_run_first: true
  notes: "Erst Dry-Run, dann maximal 100 Schritte. Kein Chat-Training, kein GGUF-Export."
