project:
  model_line: quantum-1-echelon
  candidate: 48k
  status: candidate

tokenizer:
  name: quantum-1-echelon-tokenizer-48k-candidate
  type: sentencepiece_bpe
  vocab_size: 48000
  training_sample_target_tokens: 100000000
  character_coverage: 0.99995
  byte_fallback: true
  split_digits: true
  allow_whitespace_only_pieces: true
  remove_extra_whitespaces: false
  normalization_rule_name: identity

special_tokens:
  pad_token: "<pad>"
  bos_token: "<s>"
  eos_token: "</s>"
  unk_token: "<unk>"
  system_token: "<|system|>"
  user_token: "<|user|>"
  assistant_token: "<|assistant|>"
  end_token: "<|end|>"

expected_ids:
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3

evaluation:
  domains: [de, en, code, math]
  metrics:
    - bytes_per_token
    - characters_per_token
    - tokens_per_word
    - byte_fallback_rate
    - piece_surface_bytes_p95
    - piece_surface_bytes_p99
    - long_piece_rate_ge_8_bytes
    - roundtrip_failures

output:
  directory: tokenizer/echelon/1b/48k
  model_prefix: quantum-1-echelon-48k
