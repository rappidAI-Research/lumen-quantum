project:
  model_line: quantum-1-echelon
  stage: chat_sft
  status: planning

base_model:
  checkpoint: null
  tokenizer_checksum: null

chat_template:
  system_token: "<|system|>"
  user_token: "<|user|>"
  assistant_token: "<|assistant|>"
  end_token: "<|end|>"
  resize_embeddings_after_base: false

data:
  registry: null
  target_instruction_tokens_min: 50000000
  target_instruction_tokens_max: 200000000
  german_first: true
  english_regression_coverage_required: true
  deduplication_required: true
  held_out_validation_required: true
  provenance_required: true
  terms_review_required: true
  domains:
    - dialogue
    - question_answering
    - explanation
    - summarization
    - rewriting
    - analysis
    - mathematics
    - code

training:
  method: full_finetune_candidate
  hyperparameters_status: pending_base_evaluation
  precision: bf16
  non_interactive: true

release_gate:
  repeat_base_evaluations: true
  catastrophic_forgetting_check: true
  instruction_following_evaluation: true
  german_quality_evaluation: true
