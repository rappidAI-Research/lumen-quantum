model:
  model_name: quantum-1-echelon-base
  architecture: llama_causal_decoder

  vocab_size: 32768
  context_length: 2048

  hidden_size: 1280
  intermediate_size: 3584
  num_hidden_layers: 26

  num_attention_heads: 20
  num_key_value_heads: 5

  hidden_act: silu
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0

  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true

  initializer_range: 0.02
  use_cache: true
  dtype_target: bf16

  # Vorläufig. Die endgültigen IDs werden erst mit dem neuen
  # quantum-1-echelon-Tokenizer verbindlich festgelegt.
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2

preflight:
  target_parameters: 500000000
  minimum_parameters: 475000000
  maximum_parameters: 525000000
