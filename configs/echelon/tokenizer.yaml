tokenizer:
  name: quantum-1-echelon-tokenizer
  type: sentencepiece_bpe
  vocab_size: 32768

  character_coverage: 0.99995
  byte_fallback: true
  split_digits: true
  allow_whitespace_only_pieces: true
  remove_extra_whitespaces: false
  normalization_rule_name: identity

special_tokens:
  pad_token: "<pad>"
  bos_token: "<s>"
  eos_token: "</s>"
  unk_token: "<unk>"

  system_token: "<|system|>"
  user_token: "<|user|>"
  assistant_token: "<|assistant|>"
  end_token: "<|end|>"

expected_ids:
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3

output:
  directory: tokenizer/echelon
  model_prefix: quantum-1-echelon
