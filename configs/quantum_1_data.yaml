project:
  name: "rappidAI Quantum"
  dataset_name: "quantum-1-fineweb2hq-deu-pilot"
  description: "Kleine reproduzierbare deutsche Pilot-Datenpipeline fuer quantum-1."

seed: 20260703

source:
  hf_dataset: "epfml/FineWeb2-HQ"
  hf_subset: "deu_Latn"
  split: "train"
  revision: "main"
  license: "ODC-By 1.0 family; siehe Dataset Card"
  citation: "FineWeb2-HQ, EPFL Machine Learning and Optimization Laboratory"

paths:
  raw_dir: "data/quantum/raw"
  cleaned_dir: "data/quantum/cleaned"
  manifest_dir: "data/quantum/manifests"
  report_dir: "data/quantum/reports"

download:
  streaming: true
  max_documents: 10000
  max_raw_bytes: 268435456
  shuffle_buffer_size: 10000
  text_fields:
    - "text"
    - "content"
    - "raw_content"
  url_fields:
    - "url"
    - "source_url"
    - "warc_url"
    - "metadata.url"

cleaning:
  min_chars: 200
  max_chars: 40000
  min_words: 40
  max_repeated_char_run: 8
  max_non_letter_ratio: 0.40
  min_german_stopword_hits: 5
  normalize_whitespace: true
  remove_exact_duplicates: true
  boilerplate_patterns:
    - "cookie"
    - "cookies akzeptieren"
    - "datenschutz"
    - "newsletter"
    - "javascript"
    - "registrieren"
    - "einloggen"
    - "warenkorb"
    - "agb"

sampling:
  split_seed: 20260703
  train_ratio: 0.98
  validation_ratio: 0.01
  test_ratio: 0.01

manifest:
  version: "quantum-1-fineweb2hq-deu-pilot-v0"
  notes: "Pilotmenge aus FineWeb2-HQ deu_Latn; noch kein quantum-1-Training."
