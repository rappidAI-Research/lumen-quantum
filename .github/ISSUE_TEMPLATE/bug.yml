name: Bug report
description: Report a reproducible defect in code, configuration, tests, or docs.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal data, restricted datasets, unpublished weights, or private paths. Use SECURITY.md for vulnerabilities."
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: "Full commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, CPU, memory, and GPU/runtime if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
