name: Documentation issue
description: Report inaccurate, missing, stale, or unclear documentation.
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: File, section, or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current problem
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction and sources
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed secrets, personal data, private paths, and restricted material.
          required: true
