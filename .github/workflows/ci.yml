name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff formatting
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Type checking
        run: mypy

      - name: Validate configuration and report files
        run: python scripts/validate_repository_configs.py

      - name: Repository health
        run: python scripts/repository_health.py

      - name: Local Markdown links
        run: python scripts/check_markdown_links.py

      - name: High-confidence secret patterns
        run: python scripts/check_secrets.py

      - name: Lightweight CPU tests
        run: python -m pytest tests/test_repository_health.py -m "unit and not slow and not gpu and not network"

  cpu-ml-tests:
    name: Fast CPU ML tests / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DATASETS_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.3,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ml,dev]"

      - name: Fast offline CPU tests
        run: python -m pytest -m "not slow and not gpu and not network"
